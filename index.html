<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="prefetch" href="favicon.ico" as="icon" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <link rel="stylesheet" type="text/css" href="styles.css" />
    <link rel="preload" href="styles.css" />

    <link rel="preload" href="tic-tac-toe.js" as="script" />

    <title>Tic Tac Toe</title>
  </head>
  <body>
    <div class="container">
      <div class="element-center mt-100">
        <div class="tic-tac-toe-body">
          <div class="cell" data-index="0"></div>
          <div class="cell" data-index="1"></div>
          <div class="cell" data-index="2"></div>
          <div class="cell" data-index="3"></div>
          <div class="cell" data-index="4"></div>
          <div class="cell" data-index="5"></div>
          <div class="cell" data-index="6"></div>
          <div class="cell" data-index="7"></div>
          <div class="cell" data-index="8"></div>
        </div>
      </div>
      <div class="element-center flex-col">
        <p id="current-player">
          Current Player:
          <span style="margin-left: 2px; margin-top: 3px; color: red">X</span>
        </p>
        <button
          class="reset-btn"
          onclick="resetGame()"
          style="margin-top: 20px"
        >
          Reset Game
        </button>
      </div>
    </div>

    <script src="tic-tac-toe.js" defer></script>
  </body>
</html>
